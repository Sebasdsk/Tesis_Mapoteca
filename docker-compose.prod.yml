# Sistema de Gestión de Mapoteca UAS - stack de producción (verificación local)
# El front se despliega aparte en Vercel; aquí solo db + back para probar el
# backend tal como corre en Render (sin hot-reload, sin montar el código).
# Uso: docker compose -f docker-compose.prod.yml up --build
services:
  db:
    image: postgres:16-alpine
    container_name: mapoteca_db_prod
    environment:
      POSTGRES_USER: mapoteca_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: mapoteca_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapoteca_user -d mapoteca_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build: ./Back
    container_name: mapoteca_back_prod
    environment:
      DATABASE_URL: postgresql://mapoteca_user:${POSTGRES_PASSWORD}@db:5432/mapoteca_db
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mapoteca.uas.edu.mx}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Migraciones -> seed admin (sin datos demo) -> API. Sin --reload.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata_prod:
